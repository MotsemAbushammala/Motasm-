<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحتي الشخصية - بشار</title>
    <!-- استدعاء خط عربي أنيق من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- استدعاء مكتبة GSAP للأنيميشن -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            opacity: 0; /* للبحر المبدئي قبل أن يحركه GSAP */
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #38bdf8;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        h3 {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .skill-badge {
            background: #1e293b;
            color: #38bdf8;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: 0.3s;
        }

        .skill-badge:hover {
            background: #38bdf8;
            color: #0f172a;
            transform: translateY(-3px);
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #fff;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>

    <div class="container" id="mainCard">
        <!-- صورة شخصية افتراضية (يمكنك استبدال رابطها بصورتك) -->
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" alt="صورة الملف الشخصي" class="profile-img" id="profileImg">
        
        <h1 id="nameTitle">أهلاً بك، أنا معتصم أبو شمالة</h1>
        <h3 id="jobTitle">مطور برمجيات ومهتم بتقنيات الويب</h3>
        
        <p id="bioText">
            أسعى دائماً لتطوير مهاراتي البرمجية وبناء تطبيقات ويب ذكية وعصرية. أمتلك شغفاً كبيراً بتعلم تقنيات جديدة مثل بايثون، تصميم الواجهات، وإدارة قواعد البيانات.
        </p>

        <div class="skills" id="skillsContainer">
            <span class="skill-badge">Python</span>
            <span class="skill-badge">Java</span>
            <span class="skill-badge">HTML & CSS</span>
            <span class="skill-badge">SQL Server</span>
            <span class="skill-badge">UI/UX Design</span>
        </div>

        <a href="#" class="btn" id="contactBtn">تواصل معي</a>
    </div>

    <script>
        // استخدام مكتبة GSAP لعمل حركات وأنيميشن احترافية عند فتح الصفحة
        gsap.to("#mainCard", {
            duration: 1.2,
            opacity: 1,
            y: 0,
            ease: "power3.out",
            startAt: { y: 50 }
        });

        // أنيميشن تتابعي للعناصر داخل الصفحة
        gsap.from("#profileImg", { duration: 1, scale: 0, delay: 0.3, ease: "back.out(1.7)" });
        gsap.from("#nameTitle", { duration: 0.8, opacity: 0, y: 20, delay: 0.5 });
        gsap.from("#jobTitle", { duration: 0.8, opacity: 0, y: 20, delay: 0.7 });
        gsap.from("#bioText", { duration: 0.8, opacity: 0, y: 20, delay: 0.9 });
        gsap.from(".skill-badge", { duration: 0.6, opacity: 0, y: 15, stagger: 0.1, delay: 1.1 });
        gsap.from("#contactBtn", { duration: 0.8, opacity: 0, scale: 0.8, delay: 1.4 });
    </script>

</body>
</html>
